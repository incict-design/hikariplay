<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Dot Drawing</title>

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        user-select: none;
        touch-action: none;
    }
    .tabs {
        position: fixed;
        top: 0;
        width: 100%;
        display: flex;
        z-index: 10;
    }
    .tab-btn {
        flex: 1;
        padding: 4px;
        background: #222;
        color: #fff;
        text-align: center;
        border-right: 1px solid #444;
        cursor: pointer;
        font-size: 12px;
        user-select: none;
    }
    .tab-btn.active {
        background: #555;
    }
    .tab-content {
        display: none;
        padding-top: 50px;
        color: white;
        text-align: center;
        font-size: 20px;
    }
    .tab-content.active {
        display: block;
    }
    canvas {
        display: block;
    }
    #tab2-controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        display: flex;
        justify-content: center;
        gap: 20px;
    }
    #tab2-controls button {
        background: none;
        border: none;
        color: white;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
    }
    #tab2-controls button:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="tabs">
    <div class="tab-btn active" id="tab1-btn" onclick="switchTab(1)">shooting stars</div>
    <div class="tab-btn" id="tab2-btn" onclick="switchTab(2)">karinto</div>
</div>

<div id="tab1" class="tab-content active"></div>
<div id="tab2" class="tab-content"></div>

<div id="tab2-controls" style="display: none;">
    <button id="undo-btn">戻る</button>
    <button id="clear-btn">消去</button>
</div>

<canvas id="canvas"></canvas>

<script>
const STORAGE_KEY = "permanentStrokes";
const TAB_HEIGHT_OFFSET = 50;
let currentTab = 1;
let saveInterval = null;

function switchTab(n) {
    currentTab = n;

    document.querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === n - 1);
    });
    document.querySelectorAll(".tab-content").forEach((content, i) => {
        content.classList.toggle("active", i === n - 1);
    });

    document.getElementById("tab2-controls").style.display = n === 2 ? 'flex' : 'none';

    if (n === 2) {
        loadPermanentStrokes();
        startAutoSave();
    } else {
        stopAutoSave();
        dots = [];
    }
}

function startAutoSave() {
    stopAutoSave();
    saveInterval = setInterval(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(permanentStrokes));
    }, 1000);
}
function stopAutoSave() {
    if (saveInterval) clearInterval(saveInterval);
}

let permanentStrokes = [];

function loadPermanentStrokes() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        permanentStrokes = JSON.parse(saved);
    }
}

function clearAllStrokes() {
    permanentStrokes = [];
    localStorage.removeItem(STORAGE_KEY);
}

function undoLastStroke() {
    if (permanentStrokes.length > 0) {
        permanentStrokes.pop();
    }
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let dots = [];
let drawing = false;

function randomColor() {
    const colors = [
        "red", "blue", "yellow", "green", "cyan", "magenta", "deepskyblue",
        "aqua", "springgreen", "chartreuse", "fuchsia", "pink", "lightgreen",
        "lightskyblue", "plum", "khaki", "white"
    ];
    return colors[Math.floor(Math.random() * colors.length)];
}

canvas.addEventListener("pointerdown", e => {
    drawing = true;
    if (currentTab === 2) {
        permanentStrokes.push([]);
    }
    addDot(e);
});

canvas.addEventListener("pointermove", e => {
    if (drawing) addDot(e);
});

canvas.addEventListener("pointerup", () => drawing = false);
canvas.addEventListener("pointerleave", () => drawing = false);

function addDot(e) {
    const correctedY = e.clientY - TAB_HEIGHT_OFFSET;
    const dotData = {
        x: e.clientX,
        y: correctedY,
        color: randomColor(),
    };

    dots.push({
        ...dotData,
        size: 10,
        opacity: 1.0,
        scale: 1.0
    });

    if (currentTab === 2 && permanentStrokes.length > 0) {
        permanentStrokes[permanentStrokes.length - 1].push(dotData);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // タブ2のときだけ permanentStrokes を表示
    if (currentTab === 2) {
        permanentStrokes.forEach(stroke => {
            stroke.forEach(p => {
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });
        });
    }

    // dotsアニメーション
    dots.forEach(dot => {
        ctx.globalAlpha = dot.opacity;
        ctx.fillStyle = dot.color;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.size * dot.scale, 0, Math.PI * 2);
        ctx.fill();

        dot.opacity *= 0.92;
        dot.scale *= 1.05;
    });

    dots = dots.filter(dot => dot.opacity > 0.03);

    requestAnimationFrame(draw);
}
draw();

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('undo-btn').addEventListener('click', () => {
        undoLastStroke();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(permanentStrokes));
    });

    document.getElementById('clear-btn').addEventListener('click', clearAllStrokes);
});
</script>

</body>
</html>
